services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recoveryos
      POSTGRES_PASSWORD: recoveryos
      POSTGRES_DB: recoveryos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveryos -d recoveryos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - recoveryos_postgres:/var/lib/postgresql/data

volumes:
  recoveryos_postgres:
